name: Ship v1.0.11

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ship-v111.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Materialize application icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = "GeckoPeeks/Assets/gecko-peeks.ico.b64"
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $b64)) { throw "Missing $b64" }
          if (-not (Test-Path -LiteralPath $ico)) { certutil -decode $b64 $ico }
          if (-not (Test-Path -LiteralPath $ico)) { throw "Icon decode failed" }
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Smoke-run GeckoPeeks.exe
        shell: pwsh
        run: ./.github/scripts/smoke-exe.ps1 -Exe "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe" -ExpectVersion "1.0.11" -OutDir smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-v1.0.11
          path: smoke
          if-no-files-found: warn
      - name: Tag and release v1.0.11
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.0.11"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }

          # A tag that already exists is never moved: a re-run may only finish the release for the same commit.
          $head = (git rev-parse HEAD).Trim()
          $existing = $null
          foreach ($line in @(git ls-remote --tags origin "refs/tags/$tag")) {
            $parts = $line -split "\s+"
            if ($parts.Count -lt 2) { continue }
            if ($parts[1] -eq "refs/tags/${tag}^{}") { $existing = $parts[0] }
            elseif ($parts[1] -eq "refs/tags/$tag" -and -not $existing) { $existing = $parts[0] }
          }
          if ($existing -and $existing -ne $head) { throw "$tag already exists at $existing, not at $head. Refusing to move it." }
          if (-not $existing) {
            git config user.name "gecko-peeks-ci"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Gecko Peeks 1.0.11"
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Pushing $tag failed." }
          }

          $notes = "Gecko Peeks 1.0.11. The window now scales properly with the display: at 125% and 150% every box grows with its text, so the SCHEDULE / LOGGING / LEAGUE / NEXT TEST captions, the LOCAL LOG buttons and the hint under the Upstream summary are drawn whole. The traceroute's Hostname column and the summary's Upstream column take the spare width, so the grids run up to their scrollbars instead of ending in an empty band. A divider between the traceroute and the recent log can be dragged to give either more room. No row is highlighted at startup, and the bold latency numbers stay bold on every row. Exit the old tray app (right-click the gecko > Exit) before running the new GeckoPeeks.exe, then check the title bar shows v1.0.11."
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false --notes $notes
          } else {
            gh release create $tag $exe --title $tag --notes $notes --target main
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
