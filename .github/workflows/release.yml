name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Materialize application icon
        shell: pwsh
        run: |
          $b64 = "GeckoPeeks/Assets/gecko-peeks.ico.b64"
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $b64)) { throw "Missing $b64" }
          certutil -decode $b64 $ico
          if (-not (Test-Path -LiteralPath $ico)) { throw "Icon decode failed" }
          (Get-Item -LiteralPath $ico).Length

      - name: Test
        shell: pwsh
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -v:n

      - name: Create release v1.0.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Published exe was not found at $exe"
          }

          $tag = "v1.0.1"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -eq "v1.0.0") {
            throw "Refusing to overwrite release v1.0.0."
          }

          gh release view $tag --json tagName
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          }
          else {
            gh release create $tag $exe --title $tag --notes "Gecko Peeks 1.0.1 — embedded multi-size gecko icon for Explorer, shortcuts, and the taskbar. Header subtitle renders cleanly at common DPI scales. Start with Windows unchanged."
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
