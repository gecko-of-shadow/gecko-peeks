name: Ship v1.0.4

# One-shot: MCP/human push of this file triggers Windows publish for v1.0.4.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ship-v104.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Materialize application icon
        shell: pwsh
        run: |
          $b64 = "GeckoPeeks/Assets/gecko-peeks.ico.b64"
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $ico)) { certutil -decode $b64 $ico }
          if (-not (Test-Path -LiteralPath $ico)) { throw "Icon decode failed" }

      - name: Test
        shell: pwsh
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Tag and release v1.0.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }

          git config user.name "gecko-peeks-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a v1.0.4 -m "Gecko Peeks 1.0.4"
          git push -f origin v1.0.4

          $notes = @"
          Gecko Peeks 1.0.4 — builds on 1.0.3 with skip cancelled/offline CSV rows, crash.log cap, CSV formula guard, silent-hop early stop, Exit guard, and compressed publish.
          "@
          gh release view v1.0.4 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.4 $exe --clobber
            gh release edit v1.0.4 --notes $notes.Trim()
          }
          else {
            gh release create v1.0.4 $exe --title v1.0.4 --notes $notes.Trim() --target main
          }
