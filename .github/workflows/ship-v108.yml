name: Ship v1.0.8

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ship-v108.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Materialize application icon
        shell: pwsh
        run: |
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $ico)) { certutil -decode "GeckoPeeks/Assets/gecko-peeks.ico.b64" $ico }
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Smoke-run GeckoPeeks.exe
        shell: pwsh
        run: ./.github/scripts/smoke-exe.ps1 -Exe "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe" -ExpectVersion "1.0.8" -OutDir smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-v1.0.8
          path: smoke
          if-no-files-found: warn
      - name: Tag and release v1.0.8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          git config user.name "gecko-peeks-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a v1.0.8 -m "Gecko Peeks 1.0.8"
          git push -f origin v1.0.8
          $notes = "Gecko Peeks 1.0.8 — tray Open window (bold, top item), click/double-click opens the window and it stays open, honest latency (Last hop ms vs Riot ICMP 'no reply'), Start with Windows shows a light checkmark and repairs itself. Exit the old tray app before running."
          gh release view v1.0.8 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.8 $exe --clobber
            gh release edit v1.0.8 --draft=false --notes $notes
          } else {
            gh release create v1.0.8 $exe --title v1.0.8 --notes $notes --target main
          }
