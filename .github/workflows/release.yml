name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        shell: pwsh
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Create release v1.0.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Published exe was not found at $exe"
          }

          $tag = "v1.0.1"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -eq "v1.0.0") {
            throw "Refusing to overwrite release v1.0.0."
          }

          gh release view $tag --json tagName
          if ($LASTEXITCODE -eq 0) {
            if ($env:GITHUB_REF_TYPE -eq "tag") {
              gh release upload $tag $exe --clobber
            }
            else {
              Write-Host "Release $tag already exists; skipping branch republish."
            }
          }
          else {
            gh release create $tag $exe --title $tag --notes "Gecko Peeks 1.0.1 — embedded multi-size gecko icon (16/32/48/256) for Explorer, shortcuts, and the taskbar. Window header subtitle renders cleanly at 100%/125%/150% DPI. Start with Windows unchanged."
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
