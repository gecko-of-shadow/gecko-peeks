name: Ship v1.0.12

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ship-v112.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Materialize application icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = "GeckoPeeks/Assets/gecko-peeks.ico.b64"
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $b64)) { throw "Missing $b64" }
          if (-not (Test-Path -LiteralPath $ico)) { certutil -decode $b64 $ico }
          if (-not (Test-Path -LiteralPath $ico)) { throw "Icon decode failed" }
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Smoke-run GeckoPeeks.exe
        shell: pwsh
        run: ./.github/scripts/smoke-exe.ps1 -Exe "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe" -ExpectVersion "1.0.12" -OutDir smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-v1.0.12
          path: smoke
          if-no-files-found: warn
      - name: Tag and release v1.0.12
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.0.12"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }

          # A tag that already exists is never moved: a re-run may only finish the release for the same commit.
          $head = (git rev-parse HEAD).Trim()
          $existing = $null
          foreach ($line in @(git ls-remote --tags origin "refs/tags/$tag")) {
            $parts = $line -split "\s+"
            if ($parts.Count -lt 2) { continue }
            if ($parts[1] -eq "refs/tags/${tag}^{}") { $existing = $parts[0] }
            elseif ($parts[1] -eq "refs/tags/$tag" -and -not $existing) { $existing = $parts[0] }
          }
          if ($existing -and $existing -ne $head) { throw "$tag already exists at $existing, not at $head. Refusing to move it." }
          if (-not $existing) {
            git config user.name "gecko-peeks-ci"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Gecko Peeks 1.0.12"
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Pushing $tag failed." }
          }

          $notes = "Gecko Peeks 1.0.12. Auto-update from GitHub Releases: a few seconds after launch the app checks for a newer GeckoPeeks.exe, downloads it in the background, and the tray item becomes Install update (v…). One click swaps the file and restarts (including --tray when Start with Windows launched it). Check for updates runs the same check on demand; Cancel skips that version so it does not nag again. This is the last build you need to download by hand — later versions install from the tray. Exit the old tray app (right-click the gecko > Exit) before running the new GeckoPeeks.exe, then check the title bar shows v1.0.12."
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false --notes $notes
          } else {
            gh release create $tag $exe --title $tag --notes $notes --target main
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
