name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.0.2). Required when not running from a tag push."
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Materialize application icon
        shell: pwsh
        run: |
          $b64 = "GeckoPeeks/Assets/gecko-peeks.ico.b64"
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $b64)) { throw "Missing $b64" }
          if (-not (Test-Path -LiteralPath $ico)) {
            certutil -decode $b64 $ico
          }
          if (-not (Test-Path -LiteralPath $ico)) { throw "Icon decode failed" }
          (Get-Item -LiteralPath $ico).Length

      - name: Test
        shell: pwsh
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Published exe was not found at $exe"
          }

          $tag = $null
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG.Trim()
          }
          else {
            throw "Set a tag ref (push v*) or pass workflow_dispatch input tag (for example v1.0.2)."
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            throw "Refusing tag '$tag'. Expected vMAJOR.MINOR.PATCH."
          }
          if ($tag -eq "v1.0.0" -or $tag -eq "v1.0.1" -or $tag -eq "v1.0.2") {
            throw "Refusing to overwrite release $tag."
          }

          $notes = @"
          Gecko Peeks $($tag.Substring(1)) — tags-only release workflow, local icon build, fewer false route balloons, tighter city/provider matching, safer progress snapshots, real hop RTT and Riot averages.
          "@

          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          }
          else {
            gh release create $tag $exe --title $tag --notes $notes.Trim()
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
