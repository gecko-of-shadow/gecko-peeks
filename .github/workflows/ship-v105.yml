name: Ship v1.0.5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ship-v105.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Materialize application icon
        shell: pwsh
        run: |
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $ico)) { certutil -decode "GeckoPeeks/Assets/gecko-peeks.ico.b64" $ico }
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Tag and release v1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          git config user.name "gecko-peeks-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a v1.0.5 -m "Gecko Peeks 1.0.5"
          git push -f origin v1.0.5
          $notes = "Gecko Peeks 1.0.5 — parallel hop DNS, DPI AutoScale, SessionEnding cleanup, plus all 1.0.4 hardening (cancelled/offline skip, formula guard, silent-hop stop, Exit guard, compressed publish)."
          gh release view v1.0.5 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.5 $exe --clobber
            gh release edit v1.0.5 --notes $notes
          } else {
            gh release create v1.0.5 $exe --title v1.0.5 --notes $notes --target main
          }
