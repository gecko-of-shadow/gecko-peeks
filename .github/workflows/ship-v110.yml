name: Ship v1.0.10

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ship-v110.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Materialize application icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = "GeckoPeeks/Assets/gecko-peeks.ico.b64"
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $b64)) { throw "Missing $b64" }
          if (-not (Test-Path -LiteralPath $ico)) { certutil -decode $b64 $ico }
          if (-not (Test-Path -LiteralPath $ico)) { throw "Icon decode failed" }
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Smoke-run GeckoPeeks.exe
        shell: pwsh
        run: ./.github/scripts/smoke-exe.ps1 -Exe "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe" -ExpectVersion "1.0.10" -OutDir smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-v1.0.10
          path: smoke
          if-no-files-found: warn
      - name: Tag and release v1.0.10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.0.10"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }

          # A tag that already exists is never moved: a re-run may only finish the release for the same commit.
          $head = (git rev-parse HEAD).Trim()
          $existing = $null
          foreach ($line in @(git ls-remote --tags origin "refs/tags/$tag")) {
            $parts = $line -split "\s+"
            if ($parts.Count -lt 2) { continue }
            if ($parts[1] -eq "refs/tags/${tag}^{}") { $existing = $parts[0] }
            elseif ($parts[1] -eq "refs/tags/$tag" -and -not $existing) { $existing = $parts[0] }
          }
          if ($existing -and $existing -ne $head) { throw "$tag already exists at $existing, not at $head. Refusing to move it." }
          if (-not $existing) {
            git config user.name "gecko-peeks-ci"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Gecko Peeks 1.0.10"
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Pushing $tag failed." }
          }

          $notes = "Gecko Peeks 1.0.10. The LOCAL LOG row now sizes itself from its content, so the LOCAL LOG (CSV) caption is back and the Open log, Open folder and Copy path buttons are drawn whole instead of losing their bottom edge. The traceroute grid only redraws when the path changes, so it no longer flickers through the twenty pings of a test. Run test now or Resume during the first five seconds after start no longer runs a second test straight after the first. On a small screen the window no longer asks for a minimum size larger than the desktop. Exit the old tray app (right-click the gecko > Exit) before running the new GeckoPeeks.exe."
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false --notes $notes
          } else {
            gh release create $tag $exe --title $tag --notes $notes --target main
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
